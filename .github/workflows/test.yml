# Tests on every push and pull request.
#   test     build, unit and browser tests. The gallery build remembers every lesson that passed, by a fingerprint of its
#            inputs, so it only builds and checks the lessons that changed, in parallel; a change to the kit checks them all.
#   gallery  every gallery lesson at its defaults, minimums and maximums, on main and pull requests; lessons that already
#            passed with the same inputs are skipped, the rest run in parallel.
# A failed run writes the failing tests and their errors to the run page (scripts/ci_summary.mjs) and keeps the log and
# screenshots as an artifact. .work/ is a hidden folder, so the upload needs include-hidden-files.
# Keep the `with:` blocks in block style: a one-line { ... } mapping cannot hold a ${{ }} expression (the braces end the
# mapping), and a workflow file that does not parse starts no jobs at all.
name: test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Restore the package mirror
        uses: actions/cache@v4
        with:
          path: .cdn
          key: cdn-${{ hashFiles('kit/libraries.json', 'scripts/mirror.mjs', 'scripts/libfiles.mjs') }}

      - name: Mirror the pinned packages
        run: npm run mirror

      # Each lesson that passed is remembered by a fingerprint of its inputs (scripts/lesson_hash.mjs), so the build only
      # checks lessons that changed. The latest saved set is restored even when some inputs differ (restore-keys).
      - name: Restore the lessons checked so far
        uses: actions/cache/restore@v4
        with:
          path: .work/gallery-cache
          key: gallery-lessons-${{ hashFiles('gallery/**', 'examples/**', 'kit/**', 'scripts/build_gallery.mjs', 'scripts/lesson_hash.mjs') }}-${{ github.run_id }}
          restore-keys: |
            gallery-lessons-${{ hashFiles('gallery/**', 'examples/**', 'kit/**', 'scripts/build_gallery.mjs', 'scripts/lesson_hash.mjs') }}-
            gallery-lessons-

      - name: Build the gallery (only changed lessons are built and checked, in parallel)
        run: npm run build:gallery

      # Saved straight away, pass or fail, so a failing test later does not throw away the gallery work
      - name: Save the lessons checked so far
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .work/gallery-cache
          key: gallery-lessons-${{ hashFiles('gallery/**', 'examples/**', 'kit/**', 'scripts/build_gallery.mjs', 'scripts/lesson_hash.mjs') }}-${{ github.run_id }}

      - name: Tests (unit, toolkit, browser)
        run: |
          mkdir -p .work
          set -o pipefail
          npm test 2>&1 | tee .work/npm-test.log

      # The job summary needs a sign-in to read on some views; annotations show on the public run page
      - name: Say which tests failed, on the run page
        if: failure()
        run: |
          node scripts/ci_summary.mjs .work/npm-test.log >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci_summary.mjs .work/npm-test.log --annotate

      - name: Keep the log and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-and-screenshots
          path: |
            .work/npm-test.log
            .work/**/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  gallery:
    name: Every gallery lesson at defaults, min and max
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Lessons that passed are remembered one by one (.work/gallery-passed), so only changed lessons are swept again
      - name: Restore the lessons that already passed
        uses: actions/cache/restore@v4
        with:
          path: .work/gallery-passed
          key: gallery-passed-${{ hashFiles('gallery/**', 'examples/**', 'kit/**', 'test/gallery/**', 'test/helpers.mjs', 'scripts/lesson_hash.mjs') }}-${{ github.run_id }}
          restore-keys: |
            gallery-passed-${{ hashFiles('gallery/**', 'examples/**', 'kit/**', 'test/gallery/**', 'test/helpers.mjs', 'scripts/lesson_hash.mjs') }}-
            gallery-passed-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Restore the package mirror
        uses: actions/cache@v4
        with:
          path: .cdn
          key: cdn-${{ hashFiles('kit/libraries.json', 'scripts/mirror.mjs', 'scripts/libfiles.mjs') }}

      - name: Mirror the pinned packages
        run: npm run mirror

      - name: Test every lesson (lessons that passed with the same inputs are skipped; the rest run in parallel)
        run: |
          mkdir -p .work
          set -o pipefail
          npm run test:gallery 2>&1 | tee .work/gallery-test.log

      - name: Say which lessons failed, on the run page
        if: failure()
        run: |
          node scripts/ci_summary.mjs .work/gallery-test.log >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci_summary.mjs .work/gallery-test.log --annotate

      - name: Save the lessons that passed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .work/gallery-passed
          key: gallery-passed-${{ hashFiles('gallery/**', 'examples/**', 'kit/**', 'test/gallery/**', 'test/helpers.mjs', 'scripts/lesson_hash.mjs') }}-${{ github.run_id }}

      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-log-and-screenshots
          path: |
            .work/gallery-test.log
            .work/gallery-test/**/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
